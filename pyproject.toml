[project]
name = "diary"
version = "0.1.0"
description = ""
authors = [
    {name = "vladimir",email = "vladimirinchina@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "black (>=26.10.1,<27.0.0)"
]


[tool.black]
line_length = 119
exclude = '''
/(
    \.git
  | \.venv
)/
'''


[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.14"
# mypy_path = "src"
disallow_untyped_defs = true
warn_return_any = true
exclude = ['tests', '.venv', 'venv', 'migrations/']
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["django_filters.*", "celery.*"]
ignore_missing_imports = true


[tool.poetry]
package-mode = false


[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true