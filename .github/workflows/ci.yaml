name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: diary_test
          POSTGRES_USER: diary
          POSTGRES_PASSWORD: diary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diary -d diary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      POSTGRES_DB: diary_test
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Lint (flake8)
        run: poetry run flake8 --max-line-length=100 --exclude=migrations .
      - name: Type check (mypy)
        run: poetry run mypy .
      - name: Run tests
        run: poetry run python manage.py test
      - name: Build Docker image
        run: docker build -t diary .