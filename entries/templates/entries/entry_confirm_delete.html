{% extends "base.html" %}
{% block title %}Удаление записи{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4 text-center">
                <h1 class="h4 mb-3">Удалить запись?</h1>
                <p>«{{ object.title }}» будет удалена безвозвратно.</p>
                <form method="post" class="d-flex justify-content-center gap-2">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Да, удалить</button>
                    <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
